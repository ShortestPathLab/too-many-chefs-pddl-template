name: "The full menu: 2v2"
description: "Every dish from the earlier kitchens, from coconut juice to black forest cake. Each team has its own stores and benches, and both cook at the shared row of stations down the middle, where the hatch is."

# A kitchen split along its length. Reds work from the top half and blues from
# the bottom, each with all seventeen stores, a plate dispenser, a bin and
# three benches, one with a spare pot. The row down the middle is shared and
# can be reached from both halves: three cutboards, five cookers (each an oven
# with a stove on top; two hold pans, one a pot, and two are bare), a fryer, a
# mixer with its bowl, and the hatch. With three cutboards and several stoves,
# a team that hogs stations slows the other down rather than stopping it. Both
# ends of the middle row are open, and so are the tiles either side of the
# hatch, so either team can walk into the other's half.
#
# Every recipe from the planning parts is on the menu. Tickets pay and
# expire by how long the dish takes, so picking which tickets to chase is
# part of the game. Cooking is timed: the cutboard takes three chops, and the
# other stations cook by themselves while the chefs get on with something
# else.
