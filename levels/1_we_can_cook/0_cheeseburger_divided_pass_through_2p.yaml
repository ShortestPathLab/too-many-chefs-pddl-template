name: "Cheeseburgers: crossed preparation (2 chefs)"
description: "Meat and cheese start opposite their preparation stations. Pass them across, cook and slice, then assemble cheeseburgers."

layout: |-
  | M | -/| -p| - |   | C | B |
  |   | 1 |   | - |   | 2 |   |
  |   |   |   | - |   | VR|   |
  | X |   |   | - |   | -p| * |

state:
  orders:
    - catalog/food/cheeseburger
    - catalog/food/cheeseburger
appearance:
  floor_type: -1
  wall_type: -1
  background: 6
soundtrack:
  - we-can-cook-together-side-a
  - we-can-cook-together-side-b
  - digital-kitchen-side-b
legend:
  counters:
    - symbol: "-"
  plates:
    - symbol: p
  bins:
    - symbol: X
  equipment:
    - symbol: /
      name: catalog/equipment/cutboard
    - symbol: V
      name: catalog/equipment/stove
    - symbol: R
      name: catalog/equipment/pan
  storages:
    - symbol: B
      food_name: catalog/food/bun
    - symbol: M
      food_name: catalog/food/meat
    - symbol: C
      food_name: catalog/food/cheese
  foods:
    - name: catalog/food/bun
    - name: catalog/food/meat
    - name: catalog/food/cheese
    - name: catalog/food/grilled_meat
    - name: catalog/food/sliced_cheese
    - name: catalog/food/bun_cheese
    - name: catalog/food/patty_cheese
    - name: catalog/food/hamburger
    - name: catalog/food/cheeseburger
  deliveries:
    - symbol: "*"
  agents:
    - symbol: "1"
      orientation: e
    - symbol: "2"
      orientation: w

recipes:
  cook:
    - ingredient: catalog/food/cheese
      with: catalog/equipment/cutboard
      to_make: catalog/food/sliced_cheese
    - ingredient: catalog/food/meat
      with: catalog/equipment/pan
      to_make: catalog/food/grilled_meat
  combine:
    - ingredients: [catalog/food/sliced_cheese, catalog/food/bun]
      to_make: catalog/food/bun_cheese
    - ingredients: [catalog/food/bun, catalog/food/grilled_meat]
      to_make: catalog/food/hamburger
    - ingredients: [catalog/food/sliced_cheese, catalog/food/grilled_meat]
      to_make: catalog/food/patty_cheese
    - ingredients: [catalog/food/bun_cheese, catalog/food/grilled_meat]
      to_make: catalog/food/cheeseburger
    - ingredients: [catalog/food/hamburger, catalog/food/sliced_cheese]
      to_make: catalog/food/cheeseburger
    - ingredients: [catalog/food/patty_cheese, catalog/food/bun]
      to_make: catalog/food/cheeseburger
