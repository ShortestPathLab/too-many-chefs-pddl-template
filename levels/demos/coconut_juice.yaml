name: "Coconut juice"
description: "Chop a coconut, plate the juice, and deliver your first order."

layout: |-
  |   |   |   | - | -p| -p|   |
  |   | 1 |   | C |   | * |   |
  |   |   |-/ |   |   |   |   |
  | - |   |   |   |   | X |   |
  |   |   |   |   |   |   |   |
  |   |   |   |   |   |   |   |
  |   |   |   |   | - |   |   |

state:
  orders:
    - catalog/food/coconut_juice
appearance:
  floor_type: -1
  wall_type: -1
  background: 3
soundtrack:
  - low-key-cooking-side-a
  - low-key-cooking-side-b
  - digital-kitchen-side-a
legend:
  counters:
    - symbol: "-"
  plates:
    - symbol: p
  bins:
    - symbol: X
  equipment:
    - symbol: /
      name: catalog/equipment/cutboard
  storages:
    - symbol: C
      food_name: catalog/food/coconut
  foods:
    - name: catalog/food/coconut
    - name: catalog/food/coconut_juice
  deliveries:
    - symbol: "*"
  agents:
    - symbol: "1"
      orientation: s

recipes:
  cook:
    - ingredient: catalog/food/coconut
      with: catalog/equipment/cutboard
      to_make: catalog/food/coconut_juice
  combine: []
