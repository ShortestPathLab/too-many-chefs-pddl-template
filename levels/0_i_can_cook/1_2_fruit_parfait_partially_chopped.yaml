name: "Fruit parfait: finish chopping"
description: "The watermelon is already chopped. Retrieve and chop pineapple, then assemble the parfait with yoghurt."

layout: |-
  |   | -w| P | Y | -/| -p| * |
  |   | 1 |   |   |   |   |   |
  |   |   |   |   |   |   | X |

state:
  orders:
    - food: catalog/food/fruit_parfait
      time_limit: 75
appearance:
  background: 2
soundtrack:
  - digital-kitchen-side-a
  - low-key-cooking-side-b
  - low-key-cooking-side-a
legend:
  counters:
    - symbol: "-"
  plates:
    - symbol: p
  bins:
    - symbol: X
  equipment:
    - symbol: /
      name: catalog/equipment/cutboard
  storages:
    - symbol: P
      food_name: catalog/food/pineapple
    - symbol: Y
      food_name: catalog/food/yoghurt
  foods:
    - name: catalog/food/pineapple
    - symbol: w
      name: catalog/food/chopped_watermelon
    - name: catalog/food/chopped_pineapple
    - name: catalog/food/yoghurt
    - name: catalog/food/fruit_salad
    - name: catalog/food/fruit_parfait
  deliveries:
    - symbol: "*"
  agents:
    - symbol: "1"
      orientation: n

recipes:
  cook:
    - ingredient: catalog/food/pineapple
      with: catalog/equipment/cutboard
      to_make: catalog/food/chopped_pineapple
  combine:
    - ingredients:
        - catalog/food/chopped_watermelon
        - catalog/food/chopped_pineapple
      to_make: catalog/food/fruit_salad
    - ingredients:
        - catalog/food/fruit_salad
        - catalog/food/yoghurt
      to_make: catalog/food/fruit_parfait
