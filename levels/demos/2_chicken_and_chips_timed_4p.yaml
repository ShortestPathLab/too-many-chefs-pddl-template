name: "Chicken and chips: against the clock (4 chefs)"
description: "Four chefs, tickets revealed one at a time, and stations that cook on their own clock."

layout: |-
  | 1 |   |   |   | - |   |   |   | 4 |
  |   | O |-/ |   | - |   | C | P |   |
  |   |   |   |   |-p |   |   |   |   |
  |   |   |   |   |-p |   |   |   |   |
  |   | D |   |   | - |   | * | X |   |
  | 3 |   |   |   | - |   |   |   | 2 |

state:
  orders:
    - catalog/food/chicken_and_chips
    - food: catalog/food/chicken_and_chips
      reward: 120
      time_limit: 45
    - food: catalog/food/chicken_and_chips
      reward: 200
      time_limit: 30

rules:
  timed_cooking: true
  order_reveal: sequential
  default_order_time_limit: 60

scoring:
  default_order_reward: 60
  produce_order_component_reward: 2

legend:
  counters:
    - symbol: "-"
  plates:
    - symbol: p
  bins:
    - symbol: X
  deliveries:
    - symbol: "*"
  equipment:
    - symbol: /
      name: catalog/equipment/cutboard
    - symbol: O
      name: catalog/equipment/oven
    - symbol: D
      name: catalog/equipment/deep_fryer
  storages:
    - symbol: C
      food_name: catalog/food/chicken
    - symbol: P
      food_name: catalog/food/potato
  foods:
    - name: catalog/food/chicken
    - name: catalog/food/potato
    - name: catalog/food/oven_chicken
    - name: catalog/food/chopped_potato
    - name: catalog/food/chips
    - name: catalog/food/chicken_and_chips
  agents:
    - symbol: "1"
      orientation: n
    - symbol: "2"
      orientation: s
    - symbol: "3"
      orientation: e
    - symbol: "4"
      orientation: w

recipes:
  cook:
    - ingredient: catalog/food/chicken
      with: catalog/equipment/oven
      to_make: catalog/food/oven_chicken
    - ingredient: catalog/food/potato
      with: catalog/equipment/cutboard
      to_make: catalog/food/chopped_potato
    - ingredient: catalog/food/chopped_potato
      with: catalog/equipment/deep_fryer
      to_make: catalog/food/chips
  combine:
    - ingredients: [catalog/food/oven_chicken, catalog/food/chips]
      to_make: catalog/food/chicken_and_chips

appearance:
  floor_type: -1
  wall_type: -1
  background: 2
soundtrack:
  - turning-up-the-heat
  - we-can-cook-together-side-a
