name: "Coconut juice: start chopping"
description: "Take the coconut from the counter, chop it into juice, then plate and serve."

layout: |-
  |   | -c| -/| -p| * |
  |   | 1 |   |   |   |
  |   |   |   |   | X |

state:
  orders:
    - food: catalog/food/coconut_juice
      time_limit: 40
appearance:
  background: 3
soundtrack:
  - digital-kitchen-side-a
  - low-key-cooking-side-b
  - low-key-cooking-side-a
legend:
  counters:
    - symbol: "-"
  plates:
    - symbol: p
  bins:
    - symbol: X
  equipment:
    - symbol: /
      name: catalog/equipment/cutboard
  foods:
    - symbol: c
      name: catalog/food/coconut
    - name: catalog/food/coconut_juice
  deliveries:
    - symbol: "*"
  agents:
    - symbol: "1"
      orientation: n

recipes:
  cook:
    - ingredient: catalog/food/coconut
      with: catalog/equipment/cutboard
      to_make: catalog/food/coconut_juice
  combine: []
