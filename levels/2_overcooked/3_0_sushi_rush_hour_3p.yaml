name: "Sushi: rush hour (3 chefs)"
description: "Tickets arrive one at a time and expire. The third one pays three times as much on a much shorter clock."

# Sequential tickets with deadlines, on timed stations. Rice takes six steps in
# the pot and both dishes need it, so a kitchen that keeps cooked rice ready
# can make the short deadline. One that starts each ticket from nothing cannot.
# The reference controller takes 44 steps for a sushi from scratch and about 30
# for a bowl, so it meets the default limit and misses the priority ticket.
layout: |-
  | R |-VO|-VP| - | - | F | -/| - | N |
  |   |   |   |   |   |   |   |   |   |
  |   | 1 |   |   | 2 |   |   | 3 |   |
  |   |   |   |   |   |   |   |   |   |
  | X | -p| -p| -p| -p| - | - |   | * |

state:
  orders:
    - catalog/food/sushi
    - catalog/food/fish_and_rice_bowl
    - food: catalog/food/sushi
      reward: 150
      time_limit: 25
    - catalog/food/fish_and_rice_bowl
rules:
  timed_cooking: true
  order_reveal: sequential
  default_order_time_limit: 60
appearance:
  background: 5
soundtrack:
  - turning-up-the-heat
  - galaxy-famous-chef
legend:
  counters:
    - symbol: "-"
  plates:
    - symbol: p
  bins:
    - symbol: X
  equipment:
    - symbol: V
      name: catalog/equipment/stove
    - symbol: O
      name: catalog/equipment/pot
    - symbol: P
      name: catalog/equipment/pan
    - symbol: /
      name: catalog/equipment/cutboard
  storages:
    - symbol: R
      food_name: catalog/food/rice
    - symbol: N
      food_name: catalog/food/nori
    - symbol: F
      food_name: catalog/food/fish
  foods:
    - name: catalog/food/rice
    - name: catalog/food/nori
    - name: catalog/food/fish
    - name: catalog/food/cooked_rice
    - name: catalog/food/grilled_fish
    - name: catalog/food/sliced_fish
    - name: catalog/food/nigiri
    - name: catalog/food/sushi
    - name: catalog/food/fish_and_rice_bowl
  deliveries:
    - symbol: "*"
  agents:
    - symbol: "1"
      orientation: n
    - symbol: "2"
      orientation: n
    - symbol: "3"
      orientation: n

recipes:
  cook:
    - ingredient: catalog/food/rice
      with: catalog/equipment/pot
      to_make: catalog/food/cooked_rice
    - ingredient: catalog/food/fish
      with: catalog/equipment/pan
      to_make: catalog/food/grilled_fish
    - ingredient: catalog/food/fish
      with: catalog/equipment/cutboard
      to_make: catalog/food/sliced_fish
  combine:
    - ingredients: [catalog/food/cooked_rice, catalog/food/sliced_fish]
      to_make: catalog/food/nigiri
    - ingredients: [catalog/food/nigiri, catalog/food/nori]
      to_make: catalog/food/sushi
    - ingredients: [catalog/food/cooked_rice, catalog/food/grilled_fish]
      to_make: catalog/food/fish_and_rice_bowl
