name: "Carrot salad: 2v2"
description: "The quickest dish: chop a carrot and plate it. Each team has its own carrots and boards, and both race for the one delivery hatch."

layout: |-
  |   |   |   |   |   |   |   |   |   |   |   |
  |   | K | -/| -/| - | * | - | -/| -/| K |   |
  |   |   |   |   |   |   |   |   |   |   |   |
  | D | 1 |   |   |   |   |   |   |   | 3 | D |
  | - | 2 |   |   | - | - | - |   |   | 4 | - |
  | - | X | - | - | - | - | - | - | - | X | - |

state:
  orders:
    - carrot_salad
rules:
  infinite_orders: true
  order_seed: 0
  max_visible_orders: 3
appearance:
  floor_type: -1
  wall_type: -1
  background: 5
soundtrack:
  - turning-up-the-heat
legend:
  counters:
    - symbol: "-"
  plate_dispensers:
    - symbol: D
      infinite_supply: true
  bins:
    - symbol: X
  equipment:
    - symbol: /
      name: catalog/equipment/cutboard
  storages:
    - symbol: K
      food_name: carrot
  foods:
    # Defined here, not in the catalogue.
    - name: carrot
      sprite:
        - x: 96
          y: 112
          sheet: food.png
    - name: carrot_salad
      raw: false
      sprite:
        - x: 0
          y: 64
          sheet: food.png
  deliveries:
    - symbol: "*"
  agents:
    - { symbol: "1", name: Ada, orientation: e }
    - { symbol: "2", name: Bo, orientation: e }
    - { symbol: "3", name: Cyd, orientation: w }
    - { symbol: "4", name: Dev, orientation: w }

teams:
  reds: [Ada, Bo]
  blues: [Cyd, Dev]

recipes:
  cook:
    - ingredient: carrot
      with: catalog/equipment/cutboard
      to_make: carrot_salad
  combine: []
