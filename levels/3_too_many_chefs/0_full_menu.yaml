  | E | L | Q | C | Z | K | T | H | U | D | X | R | F | N | P | G | W | I | Y |
  |   |   |   |   |   | 1 |   |   |   |   |   |   |   | 2 |   |   |   |   |   |
  |   |   | - | -S|   |   |   |   | - | - | - |   |   |   |   | - | - |   |   |
  |   |   |   |   |   |   |   |   |   |   |   |   |   |   |   |   |   |   |   |
  |   | - |-MB| - |OV | -/|OVA| -/|   | * |   |OVS| -/|OVA| - | J | - |OV |   |
  |   |   |   |   |   |   |   |   |   |   |   |   |   |   |   |   |   |   |   |
  |   |   | - | -S|   |   |   |   | - | - | - |   |   |   |   | - | - |   |   |
  |   |   |   |   |   | 3 |   |   |   |   |   |   |   | 4 |   |   |   |   |   |
  | E | L | Q | C | Z | K | T | H | U | D | X | R | F | N | P | G | W | I | Y |
