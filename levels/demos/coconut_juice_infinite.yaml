name: "Coconut juice: from storage"
description: "Retrieve a coconut from storage and complete the chopping, plating, and delivery steps."

layout: |-
  |   | C | -/| -p| * |
  |   | 1 |   |   |   |
  |   |   |   | D | X |
rules:
  infinite_orders: true
  order_seed: 0
  max_visible_orders: 2
state:
  orders:
    - catalog/food/coconut_juice
appearance:
  floor_type: -1
  wall_type: -1
  background: 6
soundtrack:
  - low-key-cooking-side-a
  - low-key-cooking-side-b
  - digital-kitchen-side-a
legend:
  counters:
    - symbol: "-"
  plates:
    - symbol: p
  plate_dispensers:
    - symbol: D
      plate_count: 1
  bins:
    - symbol: X
  equipment:
    - symbol: /
      name: catalog/equipment/cutboard
  storages:
    - symbol: C
      food_name: catalog/food/coconut
  foods:
    - name: catalog/food/coconut
    - name: catalog/food/coconut_juice
  deliveries:
    - symbol: "*"
  agents:
    - symbol: "1"
      orientation: n

recipes:
  cook:
    - ingredient: catalog/food/coconut
      with: catalog/equipment/cutboard
      to_make: catalog/food/coconut_juice
  combine: []
