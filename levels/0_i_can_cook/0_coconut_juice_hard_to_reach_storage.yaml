name: "Coconut juice: the long way round"
description: "Navigate around the counters to reach the coconut storage, then return to prepare and serve the juice."

layout: |-
  | C | - | - | - | - |
  |   |   |   |   | - |
  | - | - | - |   | -/|
  |   | 1 |   |   | -p|
  | X |   |   |   | * |

state:
  orders:
    - catalog/food/coconut_juice
appearance:
  floor_type: -1
  wall_type: -1
  background: 2
soundtrack:
  - low-key-cooking-side-a
  - low-key-cooking-side-b
  - digital-kitchen-side-a
legend:
  counters:
    - symbol: "-"
  plates:
    - symbol: p
  bins:
    - symbol: X
  equipment:
    - symbol: /
      name: catalog/equipment/cutboard
  storages:
    - symbol: C
      food_name: catalog/food/coconut
  foods:
    - name: catalog/food/coconut
    - name: catalog/food/coconut_juice
  deliveries:
    - symbol: "*"
  agents:
    - symbol: "1"
      orientation: n

recipes:
  cook:
    - ingredient: catalog/food/coconut
      with: catalog/equipment/cutboard
      to_make: catalog/food/coconut_juice
  combine: []
