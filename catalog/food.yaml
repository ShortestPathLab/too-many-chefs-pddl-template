- name: catalog/food/egg_flour_mix
  sprite:
    # Flour goes behind despite being named second. It is the widest of the
    # three base sprites, so in front it covers all but a sliver of the egg.
    - x: 128
      y: 96
      shift_x: -2
      sheet: "food.png"
    - x: 288
      y: 128
      shift_x: 2
      sheet: "food.png"
- name: catalog/food/egg_cream_mix
  sprite:
    - x: 288
      y: 128
      shift_x: -2
      sheet: "food.png"
    - x: 240
      y: 160
      shift_x: 2
      sheet: "food.png"
- name: catalog/food/cream_flour_mix
  sprite:
    # Flour behind here too, for the same reason it goes behind the egg.
    - x: 128
      y: 96
      shift_x: -2
      sheet: "food.png"
    - x: 240
      y: 160
      shift_x: 2
      sheet: "food.png"
# Flour and cream sit at the back, the egg in front, so all three still read at
# HUD size. A row of three would bury whichever one landed in the middle.
- name: catalog/food/batter_ingredients
  sprite:
    - x: 128
      y: 96
      shift_x: -3
      shift_y: -1
      sheet: "food.png"
    - x: 240
      y: 160
      shift_x: 3
      shift_y: -1
      sheet: "food.png"
    - x: 288
      y: 128
      shift_y: 3
      sheet: "food.png"
